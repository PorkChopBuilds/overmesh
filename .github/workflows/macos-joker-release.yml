name: Intel Mac Joker release
on:
  push:
    branches: [codex/macos-joker-release]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: macos-joker-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build Intel app
        run: bash macos/build.sh
      - name: Verify bundle and backend
        run: |
          codesign --verify --deep --strict dist/OverMesh.app
          OVERMESH_DESKTOP_DATA="$RUNNER_TEMP/overmesh-test" dist/OverMesh.app/Contents/MacOS/OverMesh --backend-test
          cat "$RUNNER_TEMP/overmesh-test/backend-result.json"
          OVERMESH_TEST_DIR="$RUNNER_TEMP/overmesh-lifecycle" .macos-build-env/bin/python macos/test_lifecycle_local.py
          .macos-build-env/bin/python -m pytest tests/test_settings_app.py tests/test_serial_close_guard.py tests/test_bridge.py -q
      - name: Package release
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist/OverMesh.app OverMesh-Intel-Mac-Joker-v2.0.2.zip
          shasum -a 256 OverMesh-Intel-Mac-Joker-v2.0.2.zip > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create macos-intel-joker-v2.0.2 OverMesh-Intel-Mac-Joker-v2.0.2.zip SHA256SUMS.txt macos/README.md --target "$GITHUB_SHA" --title "OverMesh Intel Mac — Joker v2.0.2" --notes-file macos/RELEASE.md
